version: 2026.261.1747
kind:
    candy:
        version: 2026.268.2100
        description: |
            The `kind` (Kubernetes-in-Docker) tool plus its per-engine host preconditions.
            Installs the pinned kind release binary (sha256-verified against the upstream
            release manifest on non-Arch distros; the distro package on Arch), the
            kubectl/helm client toolchain, and a `kind-engine-prepare` deploy-context
            script that makes the resolved container engine ready for kind's node
            containers. kind provisions local Kubernetes clusters as node containers on
            the operator's engine, so it is host tooling: this candy is composed by a
            `target: local` deploy on the operator host (or baked into a box that will
            run kind). The engine is selected by KIND_EXPERIMENTAL_PROVIDER, which is
            charly's own engine word (podman/docker/nerdctl) — no separate selector.
            Every installed artifact is file/command-checkable at build scope.
        require:
            - '@github.com/opencharly/layer-kubernetes:v2026.241.0654'
        package:
            - ca-certificates
            - curl
            - fuse-overlayfs
            - iptables
        distro:
            arch:
                package:
                    - kind
                    - containerd
                    - nerdctl
                    - rootlesskit
                    - slirp4netns
                    - conntrack-tools
            fedora:
                package:
                    - containerd
                    - conntrack-tools
                    - iptables-nft
            debian:
                package:
                    - conntrack
                    - iptables
            ubuntu:
                package:
                    - conntrack
                    - iptables
        var:
            KIND_VERSION: v0.33.0
            KIND_NODE_VERSION: v1.37.0
            KIND_NODE_DIGEST: sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
        plan:
            # ---------------------------------------------------------------------
            # The kind binary. On Arch it comes from the distro `kind` package (the
            # package is not declared under distro.arch.package because the upstream
            # download below is the cross-distro-correct path; the arch section DOES
            # declare it, so this step is a no-op there). On every other distro the
            # pinned upstream release binary is downloaded and sha256-verified against
            # the release's own .sha256sum file — never a bare `curl | sh`.
            # ---------------------------------------------------------------------
            - run: install the pinned kind release binary, sha256-verified (skipped where the distro package already provides /usr/bin/kind)
              command: |
                set -euo pipefail
                if command -v kind >/dev/null 2>&1; then
                  echo "kind already installed: $(kind version)"
                  exit 0
                fi
                case "$(uname -m)" in
                  x86_64) arch=amd64 ;;
                  aarch64) arch=arm64 ;;
                  *) echo "unsupported arch: $(uname -m)" >&2; exit 1 ;;
                esac
                base="https://kind.sigs.k8s.io/dl/${KIND_VERSION}"
                tmp="$(mktemp -d)"
                trap 'rm -rf "${tmp}"' EXIT
                curl -fsSL --retry 3 -o "${tmp}/kind" "${base}/kind-linux-${arch}"
                curl -fsSL --retry 3 -o "${tmp}/kind.sha256sum" "${base}/kind-linux-${arch}.sha256sum"
                expected="$(awk '{print $1}' "${tmp}/kind.sha256sum")"
                actual="$(sha256sum "${tmp}/kind" | awk '{print $1}')"
                if [ "${expected}" != "${actual}" ]; then
                  echo "kind sha256 mismatch: got ${actual}, want ${expected}" >&2
                  exit 1
                fi
                install -D -m 0755 -o root -g root "${tmp}/kind" /usr/local/bin/kind
              run_as: root
            - run: write the kind node-image pin so every cluster uses the digest-pinned node image
              write: /etc/charly/kind-node-image
              content: |
                # The default kind node image this project pins. A kindcluster template's
                # `node_image:` overrides it; empty falls back to this value.
                kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
              mode: "0644"
              run_as: root
            # ---------------------------------------------------------------------
            # The per-engine host preconditions. This is a DEPLOY-context script (it
            # mutates the host, never the image build), so it is skipped at build
            # scope and run by a `target: local` deploy on the operator host. It is
            # idempotent and engine-selected: docker needs nothing beyond a reachable
            # daemon; rootless podman needs cgroup delegation + a log driver kind can
            # tail + raised pids/inotify limits; rootless nerdctl needs rootless
            # containerd running.
            # ---------------------------------------------------------------------
            - run: install the kind-engine-prepare script (per-engine host preconditions)
              write: /usr/local/bin/kind-engine-prepare
              mode: "0755"
              run_as: root
              content: |
                #!/bin/sh
                # kind-engine-prepare — make the resolved container engine ready for kind's
                # node containers. Idempotent; safe to re-run. Reads CHARLY_RUN_ENGINE
                # (podman|docker|nerdctl). Every mutation is a documented upstream kind
                # rootless precondition; nothing here is a workaround.
                #
                #   docker  — a reachable rootless/rootful daemon is all kind needs.
                #   podman  — cgroup v2 + delegation; a log driver kind can tail
                #             (rootless podman's userspace relay races systemd's boot
                #             message → "could not find a log line that matches ...");
                #             raised pids/inotify limits.
                #   nerdctl — rootless containerd must be running
                #             (containerd-rootless-setuptool.sh install).
                set -eu

                engine="${CHARLY_RUN_ENGINE:-podman}"
                echo "kind-engine-prepare: engine=${engine}"

                case "${engine}" in
                  nerdctl)
                    if [ ! -S "${XDG_RUNTIME_DIR:-/run/user/$(id -u)}/containerd-rootless/api.sock" ]; then
                      if command -v containerd-rootless-setuptool.sh >/dev/null 2>&1; then
                        echo "kind-engine-prepare: installing rootless containerd (nerdctl precondition)"
                        containerd-rootless-setuptool.sh install
                        systemctl --user enable --now containerd.service 2>/dev/null || true
                      else
                        echo "kind-engine-prepare: containerd-rootless-setuptool.sh not found; install the containerd package" >&2
                      fi
                    fi
                    ;;
                  podman)
                    # A log driver kind can reliably tail (upstream-documented rootless
                    # podman race: the userspace log relay connects after systemd emits
                    # the boot line, so kind timeouts on a healthy node).
                    confdir="${HOME}/.config/containers/containers.conf.d"
                    mkdir -p "${confdir}"
                    if ! grep -rqs '^log_driver' "${confdir}" "${HOME}/.config/containers/containers.conf" 2>/dev/null; then
                      cat > "${confdir}/99-kind.conf" <<'CONF'
                [containers]
                log_driver = "k8s-file"
                pids_limit = 65536
                CONF
                      echo "kind-engine-prepare: wrote ${confdir}/99-kind.conf (k8s-file log driver, raised pids)"
                    fi
                    if [ "$(cat /sys/fs/cgroup/cgroup.controllers 2>/dev/null | grep -cw cpuset || echo 0)" = "0" ]; then
                      echo "kind-engine-prepare: host cgroup-v2 cpuset controller not delegated; kind may still work (podman falls back)" >&2
                    fi
                    ;;
                  docker|"")
                    ;;
                  *)
                    echo "kind-engine-prepare: unknown engine ${engine}" >&2
                    exit 1
                    ;;
                esac

                # Kernel-module + inotify + port limits are engine-independent and
                # harmless when already set. Written as drop-ins so a reboot persists
                # them; applied to the running host so no reboot is needed.
                if [ -d /etc/sysctl.d ]; then
                  cat > /etc/sysctl.d/99-kind.conf <<'SYSCTL'
                fs.inotify.max_user_watches = 524288
                fs.inotify.max_user_instances = 512
                SYSCTL
                  sysctl -q -p /etc/sysctl.d/99-kind.conf 2>/dev/null || true
                fi
                if [ -d /etc/modules-load.d ]; then
                  cat > /etc/modules-load.d/99-kind.conf <<'MODULES'
                ip_tables
                iptable_nat
                ip6_tables
                ip6table_nat
                MODULES
                  for m in ip_tables iptable_nat ip6_tables ip6table_nat; do
                    modprobe "${m}" 2>/dev/null || true
                  done
                fi
                echo "kind-engine-prepare: done"
            - check: the kind binary is installed and reports the pinned version
              context:
                - build
              exit_status: 0
              stdout:
                - contains: "kind v0.33.0"
              command: /usr/local/bin/kind version
            - check: the kind binary is executable (mode 0755)
              context:
                - build
              file:
                file: /usr/local/bin/kind
                exists: true
                mode: "0755"
            - check: the kind node-image pin file records the digest-pinned default node image
              context:
                - build
              stdout:
                - contains: "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5"
              command: grep "kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5" /etc/charly/kind-node-image
            - check: the kind-engine-prepare script is installed and executable
              context:
                - build
              file:
                file: /usr/local/bin/kind-engine-prepare
                exists: true
                mode: "0755"
            - check: command=sh -n /usr/local/bin/kind-engine-prepare
              context:
                - build
              id: kind-engine-prepare-syntax
              exit_status: 0
              command: sh -n /usr/local/bin/kind-engine-prepare
            - check: the kubectl client the cluster is driven with is present
              context:
                - build
              exit_status: 0
              command: kubectl version --client
            - agent-check: with a container engine available, kind can create a local Kubernetes cluster (the live acceptance is the check-kindcluster-* R10 beds)

kind-skill:
    skill:
        name: kind
        family: kubernetes
        owner: kind
        description: |-
            The `kind` (Kubernetes-in-Docker) tool + per-engine host preconditions.
            Local Kubernetes clusters as node containers on the operator's engine
            (docker/podman/nerdctl via KIND_EXPERIMENTAL_PROVIDER). Use when composing
            the kind candy, the kindcluster substrate, or a local kind cluster.
        triggers:
            - "kind (Kubernetes-in-Docker) / kindcluster deploy / local Kubernetes-in-Docker / a kind cluster on docker-podman-nerdctl / KIND_EXPERIMENTAL_PROVIDER / composing the kind candy"
        content: |
            # kind -- Kubernetes-in-Docker local clusters

            ## Candy Properties

            | Property | Value |
            |----------|-------|
            | Install files | `charly.yml` (binary fetch + engine-prepare script) |
            | Pinned version | `v0.33.0` (edit `KIND_VERSION` in `var:` to cut over) |
            | Binaries | `/usr/local/bin/kind`, plus `kubectl`/`helm` from the required client candy |
            | Depends on | `/charly-coder:kubernetes-layer` (kubectl + helm) |

            ## What this candy does

            Installs the pinned, sha256-verified kind release binary (from the Arch
            `kind` package on Arch, the upstream release asset elsewhere) plus a
            `kind-engine-prepare` script that makes the resolved container engine ready
            for kind's node containers.

            **kind is host tooling.** It provisions local Kubernetes clusters as
            *node containers* on the operator's container engine, so it is composed by
            a `target: local` deploy on the host (or a box that runs kind inside).

            ## Engine selection — KIND_EXPERIMENTAL_PROVIDER

            The engine is charly's own engine word (`podman`/`docker`/`nerdctl`), which
            maps 1:1 to kind's `KIND_EXPERIMENTAL_PROVIDER`. The `kindcluster:` deploy's
            `engine:` field (or the resolved `engine.run`) drives it; there is no
            separate selector.

            ## Per-engine preconditions (all handled by kind-engine-prepare)

            | Engine | Precondition |
            |--------|--------------|
            | `docker` | A reachable daemon (rootless or rootful). Nothing else. |
            | rootless `podman` | cgroup v2 + a log driver kind can tail (`k8s-file`); raised pids/inotify limits. |
            | rootless `nerdctl` | Rootless containerd running (`containerd-rootless-setuptool.sh install`). |

            kindnet is kind's CNI; there is **no Traefik and no ServiceLB**, so the
            `kube: addons` check verb (which waits on the k3s addon stack) does NOT
            apply to a kind cluster — use `nodes`/`wait-nodes`/`pods`/`wait-ready`/
            `storageclass`/`raw` instead. The StorageClass is `standard`
            (rancher local-path, in the `local-path-storage` namespace).

            ## The `kindcluster:` substrate

            The candy is the host-tooling leg of the `kindcluster` substrate. A
            `kindcluster:` template provisions the cluster (engine / `node_image` /
            `nodes`); a `from:` deploy runs an optional workload applied with
            `kubectl apply -k`. The word is `kindcluster`, NOT `kind` — the bare word
            collides with the schema's own `source: {kind: …}` discriminator and with
            kind's own `kind: Cluster` config field.

            ## Loading a local image

            kind nodes have their own image store, separate from the host engine's. A
            locally-built image must be loaded in — and `kind load docker-image` is
            BROKEN on podman (measured: "image not present locally" despite the image
            existing). The provider uses the engine-agnostic `kind load image-archive`
            path, so it works on docker, podman, and nerdctl.

            ## Teardown

            `kind delete cluster --name <cluster>` — engine-scoped (the provider sets
            `KIND_EXPERIMENTAL_PROVIDER`, since `kind get/delete cluster` is
            engine-scoped: names are unique only WITHIN an engine), and idempotent on a
            missing cluster.

            ## Usage

            ```yaml
            # charly.yml -- the host tooling profile
            kind-host:
              local:
                candy:
                  - kind

            # a kindcluster template + deploy (see /charly-kubernetes:kubernetes)
            kind-lab-cluster:
              kindcluster:
                engine: podman
                node_image: kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
                nodes:
                  - role: control-plane
                    extra_port_mappings:
                      - container_port: 30080
                        host_port: 30080
                  - role: worker

            kind-lab:
              kindcluster:
                from: kind-lab-cluster
                image: my-app          # optional workload, applied via `kubectl apply -k`
                disposable: true       # if it is a check bed
            ```

            ```bash
            charly deploy add kind-host --target local     # install kind on the host
            charly deploy add kind-lab  --target kindcluster
            kubectl --context kind-lab get nodes
            ```

            ## Tests

            Build-scope: `kind version` matches the pin; `/usr/local/bin/kind` is
            mode 0755; the node-image pin file content; the engine-prepare script is
            executable and `sh -n` clean; `kubectl version --client` exits 0.

            ## Related

            - `/charly-kubernetes:check-k8s` — the `kube:` cluster-probe check verb
            - `/charly-kubernetes:kubernetes` — the `kubernetes:` cluster template
            - `/charly-core:deploy` — `charly deploy add/del`
            - `/charly-image:layer` — candy authoring reference
